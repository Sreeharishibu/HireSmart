services:

  mysql:
    image: mysql:8.0
    container_name: hiresmart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hiresmart
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./HireSmart
    container_name: hiresmart-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hiresmart
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: HireSmartSecretKeyForJwtAuthentication2026VerySecure
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./hiresmart-frontend
    container_name: hiresmart-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data: